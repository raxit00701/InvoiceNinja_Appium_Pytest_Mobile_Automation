name: Mobile E2E Automation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - stage
          - prod
      groups:
        description: 'Test Groups (e.g., smoke, reg). Leave blank to run all.'
        required: false
        default: 'smoke'
        type: string

jobs:
  run-appium-tests:
    name: Run Pytest Suite
    runs-on: macos-14 # THE FIX: Uses abundant Apple Silicon (M1/M2) runners for instant startup

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: ⚙️ Install Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 🚀 Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 📱 Boot Emulator & Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30 # API 30 is highly stable for headless CI/CD runs
          target: google_apis
          arch: aarch64 # THE FIX: Use ARM architecture to match the Apple Silicon host
          profile: pixel_6
          script: |
            echo "Starting Appium Server..."
            # Start Appium in the background (&) so the script can continue
            appium --relaxed-security & 
            
            # Wait a few seconds to ensure Appium binds to port 4723
            sleep 10 
            
            echo "Appium is running. Forcing Emulator into Root Mode..."
            adb root
            sleep 3

            echo "Executing Pytest Suite..."
            # If the user left 'groups' blank, run everything without the -m flag
            if [ -z "${{ github.event.inputs.groups }}" ]; then
              echo "No markers provided. Running ALL tests against '${{ github.event.inputs.env }}'..."
              pytest tests/ --ignore=tests/test_db.py --env=${{ github.event.inputs.env }} --alluredir=reports/allure-results -s --disable-warnings
            
            # Otherwise, inject the specific marker they requested
            else
              echo "Running '${{ github.event.inputs.groups }}' tests against '${{ github.event.inputs.env }}'..."
              pytest tests/ --ignore=tests/test_db.py -m "${{ github.event.inputs.groups }}" --env=${{ github.event.inputs.env }} --alluredir=reports/allure-results -s --disable-warnings
            fi

      - name: 📊 Upload Allure Results
        if: always() # Ensures results are saved even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results
          path: reports/allure-results
          retention-days: 7
